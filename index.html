<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloverity — Partner of your success</title>
    <meta name="description"
          content="Cloverity is a software development partner helping teams ship reliable products faster.">
    <meta property="og:title" content="Cloverity — Partner of your success">
    <meta property="og:description"
          content="Cloverity is a software development partner helping teams ship reliable products faster.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cloverity.github.io/">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#222;background:#f5f5f5;display:flex;justify-content:center;padding:20px 10px}
        #app{max-width:740px;width:100%;background:#fff;border-radius:12px;border:1px solid #ddd;overflow:hidden}
        .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #ddd;background:#fff;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:8px}
        .nav-logo{display:flex;align-items:center;gap:8px;cursor:pointer}
        .nav-logo-icon{width:30px;height:30px;border-radius:6px;background:#333;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700}
        .nav-logo span{font-weight:700;font-size:14px}
        .nav-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
        .nav-btn{padding:5px 10px;font-size:11px;border:none;border-radius:5px;background:transparent;cursor:pointer;font-weight:400;color:#333;font-family:inherit}
        .nav-btn.active{background:#eee;font-weight:600}
        .nav-btn:hover{background:#f0f0f0}
        .lang-btn{padding:4px 8px;font-size:10px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;font-weight:600;font-family:inherit}
        .lang-btn.active{border:1.5px solid #333;background:#f0f0f0}
        .cta-nav{padding:6px 14px;font-size:11px;border:none;border-radius:5px;background:#333;color:#fff;cursor:pointer;font-weight:600;margin-left:6px;font-family:inherit}
        .sec{padding:44px 24px;border-bottom:1px solid #eee}
        .sec-alt{background:#fafafa}
        h2.title{font-size:18px;font-weight:700;margin-bottom:6px;color:#111}
        h3.stitle{font-size:14px;font-weight:700;margin-bottom:4px;color:#222}
        .sub{font-size:12px;color:#888;margin-bottom:20px;line-height:1.6}
        .card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:18px;cursor:default}
        .card.click{cursor:pointer}
        .card.click:hover{border-color:#bbb}
        .btn{display:inline-block;padding:10px 22px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;border:none;font-family:inherit}
        .btn-p{background:#333;color:#fff}
        .btn-s{background:#fff;color:#333;border:1.5px solid #ccc}
        .btn:hover{opacity:.85}
        .btn-full{display:block;width:100%}
        .img-ph{width:100%;background:#ebebeb;border:2px dashed #c0c0c0;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
        .img-ph span{font-size:10px;color:#aaa}
        .badge{display:inline-block;padding:4px 10px;border-radius:4px;background:#f0f0f0;font-size:10px;font-weight:600;color:#555}
        .pill{padding:5px 12px;border-radius:20px;background:#f0f0f0;font-size:11px;font-weight:500;color:#444;display:inline-block}
        .stat-num{font-size:26px;font-weight:800;color:#222}
        .stat-label{font-size:11px;color:#888;margin-top:2px}
        .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
        .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
        .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
        .faq-item{border-bottom:1px solid #eee}
        .faq-q{padding:14px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
        .faq-q span:first-child{font-size:13px;font-weight:600}
        .faq-q .icon{font-size:16px;color:#888;transition:transform .2s}
        .faq-q .icon.open{transform:rotate(45deg)}
        .faq-a{font-size:12px;color:#666;line-height:1.7;padding-bottom:14px;display:none}
        .faq-a.show{display:block}
        .result-tag{font-size:11px;color:#333;font-weight:600;padding:6px 10px;background:#eafbe7;border-radius:4px;display:inline-block}
        table{width:100%;font-size:11px;border-collapse:collapse;table-layout:fixed}
        th,td{padding:8px 6px;text-align:center}
        th{font-weight:600;border-bottom:2px solid #ddd}
        td{border-bottom:1px solid #eee}
        th:first-child,td:first-child{text-align:left}
        .hl{background:#f9f9f9;font-weight:600}
        .footer{padding:24px;border-top:1px solid #ddd}
        .footer-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:16px}
        .footer-links{display:flex;gap:16px}
        .footer-links span{font-size:11px;color:#888;cursor:pointer}
        .footer-links span:hover{color:#555}
        .footer-bottom{border-top:1px solid #eee;padding-top:12px;display:flex;justify-content:space-between;font-size:10px;color:#bbb}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
        .form-group{margin-bottom:10px}
        .form-group label{font-size:10px;color:#888;display:block;margin-bottom:3px}
        .form-input{height:36px;border:1px solid #ddd;border-radius:6px;background:#fafafa;width:100%}
        .form-textarea{height:80px;border:1px solid #ddd;border-radius:6px;background:#fafafa;width:100%}
        .form-select{height:36px;border:1px solid #ddd;border-radius:6px;background:#fafafa;width:100%;display:flex;align-items:center;padding:0 10px;font-size:11px;color:#aaa}
        .page{display:none;min-height:400px}
        .page.active{display:block}
        .quote-mark{font-size:28px;color:#ddd;margin-bottom:8px}
        .quote-text{font-size:13px;color:#555;line-height:1.8;font-style:italic}
        .step-circle{width:32px;height:32px;border-radius:50%;background:#333;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin:0 auto 10px}
        .trust-icon{font-size:24px;margin-bottom:6px}
        .contact-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:28px}
        .hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center}
        .case-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);gap:16px}
        .about-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px}
        .cta-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
        @media(max-width:600px){
          .grid2,.grid3,.grid4,.hero-grid,.case-grid,.about-grid,.contact-grid,.cta-grid,.form-row{grid-template-columns:1fr}
          .nav{flex-direction:column;align-items:flex-start}
          .sec{padding:28px 16px}
          table{font-size:9px}
          th,td{padding:5px 3px}
        }
    </style>
</head>
<body>
<div id="app">

                         data-t="Expert Python/FastAPI developers. Scalable APIs for Agritech, Healthcare, and Automotive. Fixed-price model — clear scope, clear budget.|Досвідчені Python/FastAPI розробники. Масштабовані API для Agritech, Healthcare та Automotive. Фіксована ціна — чіткий обсяг, чіткий бюджет."></div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
                        <span class="badge" data-t="✓ Fixed-price projects|✓ Фіксована ціна"></span>
                        <span class="badge" data-t="✓ AI-powered solutions|✓ AI-рішення"></span>
                        <span class="badge" data-t="✓ 10+ years experience|✓ 10+ років досвіду"></span>
                    </div>
                    <div style="display:flex;gap:8px">

                        <button class="btn btn-s" onclick="go('cases')" data-t="Case studies|Кейси"></button>
                    </div>
                </div>
                <div class="img-ph" style="height:220px">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="2" y="2" width="20" height="20" rx="3" stroke="#aaa" stroke-width="1.5"/>
                        <circle cx="8" cy="8" r="2" fill="#bbb"/>
                        <path d="M2 16l5-5 3 3 4-4 8 8v2a2 2 0 01-2 2H4a2 2 0 01-2-2v-2z" fill="#bbb" opacity=".35"/>
                    </svg>

        <div class="sec sec-alt" style="text-align:center">
            <h2 class="title" data-t="Our track record|Наші результати"></h2>

            <div class="grid4">
                <div>
                    <div class="stat-num">10+</div>

                </div>
                <div>
                    <div class="stat-num">20+</div>

                </div>

                </div>

                    <div class="stat-label" data-t="Response time|Час відповіді"></div>
                </div>
            </div>
        </div>

        <div class="sec">
            <div style="text-align:center">
                <h2 class="title" data-t="Problems we solve|Проблеми, які вирішуємо"></h2>
                <div class="sub"
                     data-t="Whatever challenge you're facing — we have the expertise|Яка б не була задача — ми маємо досвід"></div>
            </div>

        <div class="sec sec-alt">
            <div style="text-align:center">
                <h2 class="title" data-t="What we do|Що ми робимо"></h2>
            </div>
            <div class="grid3" style="margin-top:16px" id="servicesPreview"></div>
            <div style="text-align:center;margin-top:16px">
                <button class="btn btn-s" onclick="go('services')" data-t="All services →|Всі послуги →"></button>
            </div>
        </div>

        <div class="sec" style="text-align:center">
            <div style="max-width:480px;margin:0 auto">
                <div class="quote-mark">"</div>
                <div class="quote-text"
                     data-t="Their understanding of our objectives and how to achieve them efficiently was impressive. The fixed-price model gave us full budget control.|Їхнє розуміння наших цілей і ефективний підхід вражають. Модель фіксованої ціни дала повний контроль бюджету."></div>
                <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px">
                    <div style="width:36px;height:36px;border-radius:50%;background:#e0e0e0"></div>
                    <div style="text-align:left">
                        <div style="font-size:12px;font-weight:600" data-t="Client Name|Ім'я клієнта"></div>
                        <div style="font-size:10px;color:#999" data-t="CTO @ Company|CTO @ Компанія"></div>
                    </div>

        </div>

        <div class="sec sec-alt">

                <div class="sub" data-t="Real projects, real results|Реальні проєкти, реальні результати"></div>

        <div class="sec">

            </div>
            <div style="overflow-x:auto" id="compTable"></div>
        </div>

        <div class="sec">
            <div class="grid3" id="trustBadges"></div>

        <div class="sec sec-alt">

                         data-t="Tell us about your project and we'll get back within 24 hours with a fixed-price estimate.|Розкажіть про проєкт — відповімо за 24 години з оцінкою фіксованої ціни."></div>
                    <div class="img-ph" style="height:140px">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <rect x="2" y="2" width="20" height="20" rx="3" stroke="#aaa" stroke-width="1.5"/>
                            <circle cx="8" cy="8" r="2" fill="#bbb"/>
                            <path d="M2 16l5-5 3 3 4-4 8 8v2a2 2 0 01-2 2H4a2 2 0 01-2-2v-2z" fill="#bbb"
                                  opacity=".35"/>

        <div class="sec">

                <div style="margin-top:12px" id="faqList"></div>
            </div>
        </div>

    <!-- SERVICES -->
    <div class="page" id="page-services">
        <div class="sec">
            <h2 class="title" data-t="Our services|Наші послуги"></h2>

                 data-t="Full-cycle software development with AI at the core|Повний цикл розробки з AI у центрі"></div>

        <div class="sec sec-alt">

        </div>
        <div class="sec" style="text-align:center">
            <h2 class="title" data-t="Fixed-price model|Модель фіксованої ціни"></h2>
            <div class="sub"

                    <div class="grid2" id="aboutStats"></div>
                </div>
                <div class="img-ph" style="height:260px">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">

                        <circle cx="8" cy="8" r="2" fill="#bbb"/>

<script>
    let lang = 'en';
    let currentPage = 'home';
    const pages = ['home','services','cases','blog','about','contact'];
    const navLabels = {home:['Home','Головна'],services:['Services','Послуги'],cases:['Cases','Кейси'],blog:['Blog','Блог'],about:['About','Про нас'],contact:['Contact','Контакт']};

    function T(en,ua){return lang==='en'?en:ua}
    function go(p){
      currentPage=p;
      pages.forEach(id=>{
        document.getElementById('page-'+id).classList.toggle('active',id===p);
      });
      renderNav();
      window.scrollTo(0,0);
    }
    function setLang(l){lang=l;renderAll();}

    function renderNav(){
      const c=document.getElementById('navLinks');
      let h='';
      pages.forEach(p=>{
        h+=`<button class="nav-btn ${p===currentPage?'active':''}" onclick="go('${p}')">${navLabels[p][lang==='en'?0:1]}</button>`;
      });
      h+=`<button class="lang-btn ${lang==='en'?'active':''}" onclick="setLang('en')" style="margin-left:8px">EN</button>`;
      h+=`<button class="lang-btn ${lang==='ua'?'active':''}" onclick="setLang('ua')">UA</button>`;
      h+=`<button class="cta-nav" onclick="go('contact')">${T("LET'S TALK","ЗВ'ЯЖІТЬСЯ")}</button>`;
      c.innerHTML=h;
    }

    function imgPh(height,label){
      return `<div class="img-ph" style="height:${height}px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="3" stroke="#aaa" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="#bbb"/><path d="M2 16l5-5 3 3 4-4 8 8v2a2 2 0 01-2 2H4a2 2 0 01-2-2v-2z" fill="#bbb" opacity=".35"/></svg><span>${label}</span></div>`;
    }

    function renderProblems(){
      const d=[
        [T('Need an AI-powered product?','Потрібен AI-продукт?'),T('We build LLM pipelines, RAG systems, and document intelligence solutions from scratch.','Ми будуємо LLM пайплайни, RAG системи та рішення для аналізу документів з нуля.')],
